name: AJ16 graph contracts
on:
  push:
    paths:
      - "AJ16-*-Packs/**"
      - "J3-33-*/**"
      - "J3-34-*/**"
      - "tools/verify-aj16-graphs.py"
      - ".github/workflows/aj16-graphs-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 graph roles and examples
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-aj16-graphs.py
