name: AJ11 linked list contracts
on:
  push:
    paths:
      - "AJ11-*-Packs/**"
      - "J3-23-*/**"
      - "J3-24-*/**"
      - "tools/verify-aj11-linked-lists.py"
      - ".github/workflows/aj11-linked-lists-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 linked list role contracts and examples
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-aj11-linked-lists.py
