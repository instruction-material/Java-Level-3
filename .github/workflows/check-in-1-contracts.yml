name: Check-In 1 search and growth contracts
on:
  push:
    paths:
      - "AJ-Check-In-1-Workbook-Packs/**"
      - "AJ-Check-In-1-Benchmark-Packs/**"
      - "J3-11-check-in-1-supplemental-2/**"
      - "J3-12-check-in-1-supplemental-3/**"
      - "tools/verify-check-in-1.py"
      - ".github/workflows/check-in-1-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 workbook, benchmark and both practice roles
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-check-in-1.py
