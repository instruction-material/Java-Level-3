name: Check-In 3 collections contracts
on:
  push:
    paths:
      - "AJ-Check-In-3-*-Packs/**"
      - "J3-27-*/**"
      - "J3-28-*/**"
      - "tools/verify-check-in-3-collections.py"
      - ".github/workflows/check-in-3-collections-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 checkpoint roles and examples
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-check-in-3-collections.py
