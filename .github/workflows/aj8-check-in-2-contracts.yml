name: AJ8 and Check-In 2 sorting contracts
on:
  push:
    paths:
      - "AJ8-*-Packs/**"
      - "AJ8-Alphabetical-Order/words.txt"
      - "AJ-Check-In-2-*-Packs/**"
      - "J3-15-*/**"
      - "J3-16-*/**"
      - "J3-19-*/**"
      - "J3-20-*/**"
      - "tools/verify-aj8-check-in-2.py"
      - ".github/workflows/aj8-check-in-2-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 roles, original word data and benchmark outputs
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-aj8-check-in-2.py
