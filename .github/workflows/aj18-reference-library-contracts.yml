name: AJ18 Reference Library contracts
on:
  push:
    paths:
      - "AJ18-*-Packs/**"
      - "tools/verify-aj18-reference-library.py"
      - ".github/workflows/aj18-reference-library-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 reference library starter and reference roles
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-aj18-reference-library.py
