name: AJ12 stack and queue contracts
on:
  push:
    paths:
      - "AJ12-*-Packs/**"
      - "tools/verify-aj12-stacks-and-queues.py"
      - ".github/workflows/aj12-stacks-and-queues-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 stack and queue role contracts and examples
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-aj12-stacks-and-queues.py
