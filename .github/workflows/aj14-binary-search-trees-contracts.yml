name: AJ14 binary search tree contracts
on:
  push:
    paths:
      - "AJ14-*-Packs/**"
      - "J3-29-*/**"
      - "J3-30-*/**"
      - "tools/verify-aj14-binary-search-trees.py"
      - ".github/workflows/aj14-binary-search-trees-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 tree roles and examples
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-aj14-binary-search-trees.py
