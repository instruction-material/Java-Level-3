name: AJ22 Concurrency and Simulation contracts
on:
  push:
    paths:
      - "AJ22-*/**"
      - "tools/verify-aj22-concurrency-and-simulation.py"
      - ".github/workflows/aj22-concurrency-and-simulation-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 AJ22 task and simulation roles
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-aj22-concurrency-and-simulation.py
