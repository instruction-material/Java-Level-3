name: Java capstone refactoring contracts
on:
  push:
    paths:
      - "DPR10-Capstone-Refactoring-Packs/**"
      - "tools/verify-capstone-refactoring.py"
      - ".github/workflows/capstone-refactoring-contracts.yml"
  pull_request:
    paths:
      - "DPR10-Capstone-Refactoring-Packs/**"
      - "tools/verify-capstone-refactoring.py"
      - ".github/workflows/capstone-refactoring-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capstone-refactoring-contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLASSES_FAMILY_TASK_ID: java-capstone-refactoring-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify working before and after designs, intermediate extraction, traces and independent preview
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          python3 -I -B tools/verify-capstone-refactoring.py
      - name: Retain original source and native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: java-capstone-refactoring-native-contracts
          path: |
            output/java-capstone-refactoring-contracts/
            DPR10-Capstone-Refactoring-Packs/
          if-no-files-found: error
          retention-days: 14
