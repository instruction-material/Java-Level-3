name: AJ20 and AJ21 Engineering contracts
on:
  push:
    paths:
      - "AJ20-*/**"
      - "AJ21-*/**"
      - "tools/verify-aj20-aj21-engineering.py"
      - ".github/workflows/aj20-aj21-engineering-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 engineering workbook roles
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-aj20-aj21-engineering.py
