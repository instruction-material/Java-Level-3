name: Java generalization contracts
on:
  push:
    paths:
      - "DPR7-Generalization-Packs/**"
      - "tools/verify-generalization.py"
      - ".github/workflows/generalization-contracts.yml"
  pull_request:
    paths:
      - "DPR7-Generalization-Packs/**"
      - "tools/verify-generalization.py"
      - ".github/workflows/generalization-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generalization-contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLASSES_FAMILY_TASK_ID: java-generalization-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile before/after roles and verify hierarchy, behavior and independent projects
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          python3 -I -B tools/verify-generalization.py
      - name: Retain original source and native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: java-generalization-native-contracts
          path: |
            output/java-generalization-contracts/
            DPR7-Generalization-Packs/
          if-no-files-found: error
          retention-days: 14
