name: AJ13 priority queue and map contracts
on:
  push:
    paths:
      - "AJ13-*-Packs/**"
      - "J3-25-*/**"
      - "J3-26-*/**"
      - "tools/verify-aj13-priority-queues-and-maps.py"
      - ".github/workflows/aj13-priority-queues-and-maps-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Java 21 priority queue and map role contracts and examples
        run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-aj13-priority-queues-and-maps.py
