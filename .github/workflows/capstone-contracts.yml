name: DPJ10 runnable capstone refactoring contracts
on:
  push:
    branches: [main]
    paths:
      - "DPJ10-Dispatch-Refactor-Packs/**"
      - "tools/verify-capstone.py"
      - "tools/verify-recursion.py"
      - ".github/workflows/capstone-contracts.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify clean packaged Java 21 projects and independent contracts
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          python3 tools/verify-capstone.py
